<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Registration Form</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>Student Registration Form</h1>
  <p>Fields marked with * are required.</p>
  <form id="regForm" action="#" method="post" enctype="multipart/form-data">
    <fieldset>
      <legend>Personal Information</legend>
      <p>
        <label for="fname">First Name *</label><br>
        <input type="text" id="fname" name="first_name" placeholder="Enter your first name" required minlength="2"
          maxlength="30">
      </p>
      <p>
        <label for="lname">Last Name *</label><br>
        <input type="text" id="lname" name="last_name" placeholder="Enter your last name" required minlength="2"
          maxlength="30">
      </p>
      <p>
        <label for="fathername">Father's Name *</label><br>
        <input type="text" id="fathername" name="father_name" placeholder="Enter your father's name" required>
      </p>
      <p>
        <label for="dob">Date of Birth *</label><br>
        <input type="date" id="dob" name="dob" required>
      </p>
      <p>
        Gender *<br>
        <input type="radio" id="male" name="gender" value="male" required>
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label>
      </p>
      <p>
        <label for="cnic">CNIC / B-Form No. *</label><br>
        <input type="text" id="cnic" name="cnic" placeholder="12345-1234567-1" pattern="[0-9]{5}-[0-9]{7}-[0-9]{1}"
          title="Format: 12345-1234567-1" required>
      </p>
      <p>
        <label for="photo">Profile Picture</label><br>
        <input type="file" id="photo" name="photo" accept="image/*">
      </p>
    </fieldset>
    <br>
    <fieldset>
      <legend>Contact Information</legend>
      <p>
        <label for="email">Email *</label><br>
        <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
      </p>
      <p>
        <label for="phone">Mobile Number *</label><br>
        <input type="tel" id="phone" name="phone" placeholder="03XXXXXXXXX" pattern="03[0-9]{9}"
          title="Format: 03XXXXXXXXX" required>
      </p>
      <p>
        <label for="address">Address *</label><br>
        <textarea id="address" name="address" rows="4" cols="40" placeholder="House no, Street, Area"
          required></textarea>
      </p>

      <p>
        <label for="city">City *</label><br>
        <select id="city" name="city" required>
          <option value="">-- Select City --</option>
          <option value="Hyderabad">Hyderabad</option>
          <option value="Badin">Badin</option>
          <option value="Matli">Matli</option>
          <option value="Tando Ghulam Ali">Tando Ghulam Ali</option>
          <option value="New Dumbalo">New Dumbalo</option>
          <option value="Digri">Digri</option>
          <option value="Lahore">Lahore</option>
          <option value="Karachi">Karachi</option>
          <option value="Islamabad">Islamabad</option>
          <option value="Faisalabad">Faisalabad</option>
          <option value="Multan">Multan</option>
          <option value="Peshawar">Peshawar</option>
          <option value="Quetta">Quetta</option>
        </select>
      </p>

      <p>
        <label for="country">Country *</label><br>
        <select id="country" name="country" required>
          <option value="">-- Select Country --</option>
          <option value="pk" selected>Pakistan</option>
          <option value="in">India</option>
          <option value="gb">United Kingdom</option>
          <option value="us">United States</option>
          <option value="other">Other</option>
        </select>
      </p>
    </fieldset>
    <br>
    <fieldset>
      <legend>Academic Information</legend>
      <p>
        <label for="course">Select Course *</label><br>
        <select id="course" name="course" required>
          <option value="">-- Select Course --</option>
          <optgroup label="Computer Science">
            <option value="web">Web Development</option>
            <option value="python">Python Programming</option>
            <option value="graphics">Graphic Designing</option>
          </optgroup>
          <optgroup label="Business">
            <option value="ms-office">MS Office</option>
            <option value="accounting">Accounting</option>
          </optgroup>
        </select>
      </p>
      <p>
        <label for="qualification">Last Qualification *</label><br>
        <select id="qualification" name="qualification" required>
          <option value="">-- Select --</option>
          <option value="matric">Matric</option>
          <option value="inter">Intermediate</option>
          <option value="bachelor">Bachelor</option>
          <option value="master">Master</option>
        </select>
      </p>
      <p>
        <label for="marks">Percentage / Marks (%)</label><br>
        <input type="number" id="marks" name="marks" min="0" max="100" step="0.01" placeholder="85.5">
      </p>
      <p>
        Preferred Timing *<br>
        <input type="radio" id="morning" name="timing" value="morning" required>
        <label for="morning">Morning</label>
        <input type="radio" id="evening" name="timing" value="evening">
        <label for="evening">Evening</label>
      </p>
      <p>
        Interests<br>
        <input type="checkbox" id="html" name="interests" value="html">
        <label for="html">HTML/CSS</label>
        <input type="checkbox" id="js" name="interests" value="javascript">
        <label for="js">JavaScript</label>
        <input type="checkbox" id="db" name="interests" value="database">
        <label for="db">Database</label>
        <input type="checkbox" id="ai" name="interests" value="ai">
        <label for="ai">Artificial Intelligence</label>
      </p>
      <p>
        <label for="skill">Computer Skill Level (1-10)</label><br>
        <input type="range" id="skill" name="skill" min="1" max="10" value="5">
        <output id="skillOut" for="skill">5</output>
      </p>
      <p>
        <label for="startdate">Preferred Start Date</label><br>
        <input type="date" id="startdate" name="start_date">
      </p>
      <p>
        <label for="certificate">Upload Result Card / Certificate (PDF)</label><br>
        <input type="file" id="certificate" name="certificate" accept=".pdf">
      </p>
    </fieldset>
    <br>
    <fieldset>
      <legend>Account Information</legend>
      <p>
        <label for="username">Username *</label><br>
        <input type="text" id="username" name="username" required minlength="4" maxlength="20" pattern="[A-Za-z0-9_]+"
          title="Letters, numbers and underscore only" autocomplete="username">
      </p>
      <p>
        <label for="password">Password *</label><br>
        <input type="password" id="password" name="password" required minlength="8" placeholder="Minimum 8 characters"
          autocomplete="new-password">
      </p>
      <p>
        <label for="cpassword">Confirm Password *</label><br>
        <input type="password" id="cpassword" name="confirm_password" required minlength="8"
          autocomplete="new-password">
      </p>
      <p>
        <label for="color">Favourite Color</label><br>
        <input type="color" id="color" name="fav_color" value="#0000ff">
      </p>
      <input type="hidden" name="form_id" value="reg-2026">
    </fieldset>
    <br>
    <fieldset>
      <legend>Additional Information</legend>
      <p>
        <label for="comments">Any Comments / Questions</label><br>
        <textarea id="comments" name="comments" rows="4" cols="40" maxlength="300"></textarea>
      </p>
      <p>
        <input type="checkbox" id="terms" name="terms" required>
        <label for="terms">I agree to the Terms and Conditions *</label>
      </p>
    </fieldset>
    <br>
    <button type="submit">Register</button>
    <button type="reset">Clear Form</button>
  </form>

  <script>
    var today = new Date().toISOString().split("T")[0];
    document.getElementById("dob").max = today;
    document.getElementById("startdate").min = today;

    var skill = document.getElementById("skill");
    var skillOut = document.getElementById("skillOut");
    skill.addEventListener("input", function () {
      skillOut.textContent = skill.value;
    });

    var pass = document.getElementById("password");
    var cpass = document.getElementById("cpassword");
    function checkMatch() {
      cpass.setCustomValidity(
        cpass.value && cpass.value !== pass.value ? "Passwords do not match" : ""
      );
    }
    pass.addEventListener("input", checkMatch);
    cpass.addEventListener("input", checkMatch);
  </script>
</body>

</html>
